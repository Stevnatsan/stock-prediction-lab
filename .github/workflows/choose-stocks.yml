name: choose stocks

on:
  workflow_dispatch:
    inputs:
      add:
        description: "Stocks to add, e.g. KO, PEP, BRK-B (see STOCKS.md for all S&P 500 symbols)"
        required: false
        default: ""
      remove:
        description: "Stocks to remove, e.g. TSLA"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-predictions   # never runs at the same time as the daily job
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update the watchlist
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
        run: python -m stocklab watchlist --add "$ADD" --remove "$REMOVE"
      - name: Learn the new stocks' history (predictions for them start after the next close)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m stocklab daily
      - name: Commit
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml state reports README.md
          git diff --cached --quiet || git commit -m "Watchlist update: add [$ADD] remove [$REMOVE]"
          git push
