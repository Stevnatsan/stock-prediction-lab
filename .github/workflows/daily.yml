name: daily predictions

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC on weekdays, after the US close in both summer and winter time
    - cron: "15 1 * * 2-6"    # backup, 01:15 UTC (still the same evening in New York): GitHub sometimes runs
                              # schedules hours late or drops them; a second run the same evening changes nothing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest state, even if this run was queued behind another
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install FinBERT (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-finbert.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-v1
      - name: Collect, score yesterday, learn, predict the next session
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m stocklab daily
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports README.md
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push
