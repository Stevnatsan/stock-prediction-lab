name: insight preview (temporary)
on:
  push:
    branches: [claude/reliable-runs-and-insight]
    paths: [.github/workflows/insight-preview.yml]
permissions:
  contents: write
jobs:
  insight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m stocklab insight GOOGL,AAPL,NVDA,MSFT,AMZN,META,TSLA,JPM,XOM,UNH > /dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/insight.md reports/insight.json docs
          git commit -m "Insight preview with weekly odds $(date -u +%Y-%m-%d)" && git push
